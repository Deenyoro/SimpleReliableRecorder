name: build

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            os: windows
            arch: x64
          - label: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
          - label: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - label: macos-x64
            runner: macos-15-intel
            os: macos
            arch: x64
          - label: macos-arm64
            runner: macos-latest
            os: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- ffmpeg staging (per OS) ------------------------------------- #
      - name: Stage ffmpeg (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ matrix.arch }}" -eq "arm64") {
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
          } else {
            $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          }
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Invoke-WebRequest -Uri $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx -Force
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg\ffmpeg.exe -Force

      - name: Stage ffmpeg (Linux)
        if: matrix.os == 'linux'
        run: |
          set -e
          mkdir -p ffmpeg

          # Accept a source only if it yields a binary that actually runs.
          # Retries with timeouts so a single flaky mirror cannot fail the build.
          stage_tarxz() {
            url="$1"
            echo "Trying ffmpeg (tar.xz): $url"
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
                 --max-time 300 "$url" -o ff.tar.xz || { echo "  download failed"; return 1; }
            rm -rf ffx && mkdir ffx
            tar xf ff.tar.xz -C ffx || { echo "  extract failed"; return 1; }
            bin="$(find ffx -name ffmpeg -type f | head -n1)"
            [ -n "$bin" ] || { echo "  no ffmpeg in archive"; return 1; }
            cp "$bin" ffmpeg/ffmpeg && chmod +x ffmpeg/ffmpeg
            ./ffmpeg/ffmpeg -version >/dev/null 2>&1 || { echo "  binary does not run"; return 1; }
            return 0
          }
          stage_zip() {
            url="$1"
            echo "Trying ffmpeg (zip): $url"
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
                 --max-time 300 "$url" -o ff.zip || { echo "  download failed"; return 1; }
            rm -rf ffz && mkdir ffz
            unzip -o -q ff.zip -d ffz || { echo "  unzip failed"; return 1; }
            bin="$(find ffz -name ffmpeg -type f | head -n1)"
            [ -n "$bin" ] || { echo "  no ffmpeg in archive"; return 1; }
            cp "$bin" ffmpeg/ffmpeg && chmod +x ffmpeg/ffmpeg
            ./ffmpeg/ffmpeg -version >/dev/null 2>&1 || { echo "  binary does not run"; return 1; }
            return 0
          }

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # BtbN GitHub releases are served from a fast CDN and are the most
            # reliable source; johnvansickle is the historical fallback.
            stage_tarxz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" \
              || stage_tarxz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz" \
              || { echo "Falling back to apt ffmpeg."; sudo apt-get update && sudo apt-get install -y ffmpeg && cp "$(command -v ffmpeg)" ffmpeg/ffmpeg && chmod +x ffmpeg/ffmpeg; }
          else
            stage_tarxz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              || stage_tarxz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
              || { echo "Falling back to apt ffmpeg."; sudo apt-get update && sudo apt-get install -y ffmpeg && cp "$(command -v ffmpeg)" ffmpeg/ffmpeg && chmod +x ffmpeg/ffmpeg; }
          fi
          ./ffmpeg/ffmpeg -version | head -1

      - name: Stage ffmpeg (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          mkdir -p ffmpeg

          # Try a download source and only accept it if it yields a binary that
          # actually runs. Returns non-zero on any problem so the caller can fall
          # back. This is what makes the step reliable: a flaky mirror serving an
          # HTML error page (non-empty, so old "-s" checks passed) is rejected
          # here because the extracted binary won't execute.
          stage_zip() {
            url="$1"
            echo "Trying ffmpeg source: $url"
            curl -fsSL "$url" -o ff.zip || { echo "  download failed"; return 1; }
            if ! file ff.zip | grep -qi 'zip'; then
              echo "  not a zip archive"; return 1
            fi
            rm -rf ffx && mkdir ffx
            unzip -o -q ff.zip -d ffx || { echo "  unzip failed"; return 1; }
            bin="$(find ffx -name ffmpeg -type f | head -n1)"
            if [ -z "$bin" ]; then echo "  no ffmpeg in archive"; return 1; fi
            cp "$bin" ffmpeg/ffmpeg
            chmod +x ffmpeg/ffmpeg
            if ! ./ffmpeg/ffmpeg -version >/dev/null 2>&1; then
              echo "  binary does not run on this arch"; return 1
            fi
            return 0
          }

          # evermeet is a static, self-contained x86_64 build (runs natively on
          # the Intel runner, and on Apple Silicon via the preinstalled Rosetta).
          if stage_zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"; then
            echo "Staged ffmpeg from evermeet."
          elif [ "${{ matrix.arch }}" = "arm64" ] && stage_zip "https://www.osxexperts.net/ffmpeg711arm.zip"; then
            echo "Staged ffmpeg from osxexperts (arm)."
          elif [ "${{ matrix.arch }}" = "x64" ] && stage_zip "https://www.osxexperts.net/ffmpeg711intel.zip"; then
            echo "Staged ffmpeg from osxexperts (intel)."
          else
            # Guaranteed fallback: Homebrew is preinstalled on every macOS runner
            # and always provides a native binary for the runner's arch.
            echo "Falling back to Homebrew ffmpeg."
            brew install ffmpeg
            cp "$(brew --prefix ffmpeg)/bin/ffmpeg" ffmpeg/ffmpeg
            chmod +x ffmpeg/ffmpeg
          fi
          ./ffmpeg/ffmpeg -version | head -1

      # ---- Linux GUI deps so PyInstaller/tkinter resolve --------------- #
      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 libsndfile1 \
            libpulse0 tk-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py --clean

      # ---- macOS ad-hoc code signing (the part that actually makes it run) #
      # On Apple Silicon an executable MUST carry at least an ad-hoc signature
      # or Gatekeeper kills it on launch ("is damaged / cannot be opened").
      # We do NOT notarize (no Apple Developer account needed); an ad-hoc
      # signature (-s -) is enough to make the app launchable, the same effect
      # electron-builder produces automatically. PyInstaller does not sign, so
      # we sign the produced binary ourselves. Users still right-click > Open
      # the first time (unsigned by a real cert), which is expected.
      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          chmod +x dist/SimpleReliableRecorder
          codesign --force --deep --sign - --timestamp=none \
            dist/SimpleReliableRecorder
          codesign --verify --verbose dist/SimpleReliableRecorder
          echo "Ad-hoc signature applied."

      # ---- Package portable artifact ----------------------------------- #
      - name: Package portable (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\SimpleReliableRecorder.exe `
            -DestinationPath "out\SimpleReliableRecorder-${{ matrix.label }}-portable.zip" -Force

      - name: Build Windows installer
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver) { $ver = "0.0.0" }
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" installer\windows.iss
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item installer\installer_out\*.exe out\ -Force

      - name: Package portable (Unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p out
          tar -czf "out/SimpleReliableRecorder-${{ matrix.label }}-portable.tar.gz" \
            -C dist SimpleReliableRecorder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist_all
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist_all/**/*
          generate_release_notes: true
